mailbox:
  image: docker.io/sctg/wormhole-mailbox:latest
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""   # "" = cluster default
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 128Mi}

relay:
  image: docker.io/sctg/wormhole-relay:latest
  replicas: 2
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  # The transit relay is raw TCP on 4001. How you expose it depends on your cluster.
  service:
    type: ClusterIP        # ClusterIP | NodePort | LoadBalancer
    nodePort: null         # set when type=NodePort
    annotations: {}

# Optional browser page (send/receive in the browser, link to entangle).
# Build the image from deploy/web (Containerfile) and push it to your registry first.
page:
  enabled: false
  image: docker.io/sctg/wormhole-page:latest
  # Wormhole AppID; must match the entangle clients' --app-id.
  appId: github.com/sctg-development/entangle
  entangleUrl: https://github.com/sctg-development/entangle/releases/latest
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 128Mi}

# WebSocket endpoint (wss://<host>/v1) for the mailbox.
ingress:
  enabled: false
  className: ""
  host: wormhole.example.org
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # haproxy.org/timeout-tunnel: "1h"
  tls:
    enabled: true
    secretName: wormhole-tls

podSecurityContext:
  fsGroup: 10001
