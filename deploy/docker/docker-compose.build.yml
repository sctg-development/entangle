# Override: build the images locally instead of pulling docker.io/sctg/*
# (mailbox and relay from ./Dockerfile, the browser page from ../web).
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  mailbox:
    build: {context: ., target: mailbox}
    image: entangle/wormhole-mailbox:local
  relay:
    build: {context: ., target: relay}
    image: entangle/wormhole-relay:local
  web:
    build: {context: ../web, dockerfile: Containerfile}
    image: entangle/wormhole-page:local
