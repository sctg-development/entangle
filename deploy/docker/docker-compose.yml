# Self-hosted magic-wormhole rendezvous (mailbox) + transit relay.
#
#   cp .env.example .env     # edit WORMHOLE_DOMAIN
#   docker compose up -d                       # plain: mailbox :4000, relay :4001
#   docker compose --profile tls up -d         # + Caddy: wss://$WORMHOLE_DOMAIN (Let's Encrypt)
#   docker compose --profile tls --profile web up -d   # + browser page on https://$WORMHOLE_DOMAIN/
#
# Uses the public images docker.io/sctg/wormhole-{mailbox,relay} (amd64 + arm64).
# To build them (and the page, from ../web) yourself instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  mailbox:
    image: ${WORMHOLE_MAILBOX_IMAGE:-docker.io/sctg/wormhole-mailbox:latest}
    restart: unless-stopped
    volumes: [mailbox-data:/data]
    # Plain port: use it on a LAN/VPN, or behind your own reverse proxy.
    # With the "tls" profile, remove this mapping so only Caddy is exposed.
    ports: ["${MAILBOX_BIND:-4000}:4000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  relay:
    image: ${WORMHOLE_RELAY_IMAGE:-docker.io/sctg/wormhole-relay:latest}
    restart: unless-stopped
    ports: ["${RELAY_BIND:-4001}:4001"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  # Browser client (send/receive without installing anything), public image
  # docker.io/sctg/wormhole-page (amd64 + arm64). Sources: ../web.
  # Same origin as the mailbox: Caddy routes /v1 to the mailbox, everything else here.
  web:
    profiles: [web]
    image: ${WORMHOLE_WEB_IMAGE:-docker.io/sctg/wormhole-page:latest}
    restart: unless-stopped
    environment:
      TRANSIT_RELAY: relay:4001
      # Must match the entangle clients' AppID (default github.com/sctg-development/entangle
      # since v0.8.1; older entangle used github.com/gowtham-sai-yadav/claude-teleport).
      APP_ID: ${WORMHOLE_APP_ID:-github.com/sctg-development/entangle}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    depends_on: [relay]

  caddy:
    profiles: [tls]
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      WORMHOLE_DOMAIN: ${WORMHOLE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [mailbox]

volumes:
  mailbox-data:
  caddy-data:
