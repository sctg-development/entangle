# Self-hosted magic-wormhole rendezvous (mailbox) + transit relay.
#
#   cp .env.example .env     # edit WORMHOLE_DOMAIN
#   docker compose up -d                       # plain: mailbox :4000, relay :4001
#   docker compose --profile tls up -d         # + Caddy: wss://$WORMHOLE_DOMAIN (Let's Encrypt)
#
# Images are built from ./Dockerfile; set WORMHOLE_*_IMAGE to use prebuilt ones.
services:
  mailbox:
    build: {context: ., target: mailbox}
    image: ${WORMHOLE_MAILBOX_IMAGE:-entangle/wormhole-mailbox:local}
    restart: unless-stopped
    volumes: [mailbox-data:/data]
    # Plain port: use it on a LAN/VPN, or behind your own reverse proxy.
    # With the "tls" profile, remove this mapping so only Caddy is exposed.
    ports: ["${MAILBOX_BIND:-4000}:4000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  relay:
    build: {context: ., target: relay}
    image: ${WORMHOLE_RELAY_IMAGE:-entangle/wormhole-relay:local}
    restart: unless-stopped
    ports: ["${RELAY_BIND:-4001}:4001"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  caddy:
    profiles: [tls]
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      WORMHOLE_DOMAIN: ${WORMHOLE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [mailbox]

volumes:
  mailbox-data:
  caddy-data:
